[project]
name = "merge-gate"
version = "0.1.0"
description = "Verify external PRs and route findings to the engineer who wrote the code, by iMessage."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
merge-gate = "merge_gate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["merge_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
