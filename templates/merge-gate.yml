# Copy to .github/workflows/merge-gate.yml in the repo you want to protect,
# then make the "merge-gate" status a required check in branch protection.
#
# Secrets / variables:
#   secrets.MUSE_API_KEY   optional: without it the gate runs rules + ownership only
#   vars.OWNER_GITHUB      optional: {"owner@email": "github-login"}, lets a code owner override by approving on GitHub
#
# The PR's title and body are read from the event file by the gate, never interpolated into shell
# (interpolating ${{ github.event.pull_request.body }} into `run:` lets anyone inject shell commands).

name: "Merge Gate"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

# One run per PR; a newer push or approval cancels the older run (and its LLM calls).
concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  merge-gate:
    name: "Merge Gate"
    runs-on: ubuntu-latest
    # Re-run on a review only when it approves (the owner-override path); comments don't re-run the gate.
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'approved'
    steps:
      - name: Check out the repository under review
        uses: actions/checkout@v4
        with:
          path: target    # the PR's files live here and are only ever read as data
          fetch-depth: 0  # full history: git blame on the base side, and origin/<base>
          persist-credentials: false  # don't leave GITHUB_TOKEN in target/.git/config for PR code to read

      - name: Check out Merge Gate
        uses: actions/checkout@v4
        with:
          repository: prubinadmin/MergeGateAIEHackathon
          path: gate
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pytest ./gate

      - name: Run the gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          OWNER_GITHUB: ${{ vars.OWNER_GITHUB }}
        # Run from an empty directory, never from the PR's checkout: the gate must not import the PR's merge_gate/
        # (-I), read the PR's .env, or load the PR's gate_versions/ (a PR could ship one with every rule off).
        run: |
          mkdir -p "$RUNNER_TEMP/gate-run" && cd "$RUNNER_TEMP/gate-run"
          python -I -m merge_gate ci --repo "$GITHUB_WORKSPACE/target" --out "$GITHUB_WORKSPACE/gate_result.json"

      - name: Keep the verdict report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-report
          path: gate_result.json
